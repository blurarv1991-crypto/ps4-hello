name: Ver SwanStation

on:
  push:
    paths:
      - '.github/workflows/swan.yml'
      - 'frontend/**'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          git clone --depth 1 https://github.com/libretro/swanstation.git swan
          curl -sL -o tc.tgz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir tc && tar -xzf tc.tgz -C tc
          sudo apt-get install -y clang lld python3 > /dev/null
          
          # Ajustes base para toolchain PS4
          sed -i '86s/.*/#define ABI_SYSV 1/' swan/src/core/cpu_recompiler_types.h
          sed -i 's/defined(__FreeBSD__)/defined(__x86_64__)/g' swan/src/common/memory_arena.h swan/src/common/memory_arena.cpp
          sed -i 's/std::clamp(/std::clamp<float>(/g' swan/src/core/analog_controller.cpp swan/src/core/analog_joystick.cpp swan/src/core/negcon.cpp swan/src/core/negcon_rumble.cpp
          printf '#define HAVE_MKSTEMP 1\n#define HAVE_ALLOCA_H 1\n' > swan/src/config.h
          mkdir -p swan/dep/stub
          printf '#include <pthread.h>\nstatic inline void pthread_set_name_np(pthread_t t, const char *n) { (void)t; (void)n; }\n' > swan/dep/stub/pthread_np.h
          sed 's/@[A-Za-z_0-9]*@/0/g' swan/src/libretro/version.h.in > swan/src/libretro/version.h

          # Parches de EmuSuNi para JIT Arena y RAM sin shm_open en PS4
          python3 - << 'EOF'
          import os

          # 1. Parche en bus.cpp: Memoria RAM directa de heap sin shm_open / fastmem mmap
          bus_file = 'swan/src/core/bus.cpp'
          if os.path.exists(bus_file):
              with open(bus_file, 'r') as f:
                  content = f.read()
              if 'm_memory_arena.Initialize' in content:
                  content = content.replace(
                      'm_memory_arena.Initialize(RAM_SIZE, false, false)',
                      '#if defined(EMUSUNI_PORT)\n  m_ram = (u8*)std::calloc(1, RAM_SIZE);\n#else\n  m_memory_arena.Initialize(RAM_SIZE, false, false)\n#endif'
                  )
                  with open(bus_file, 'w') as f:
                      f.write(content)
                  print("Parche bus.cpp aplicado.")

          # 2. Parche en cpu_code_cache.cpp: Usar emusuni_jit_arena para el buffer de codigo ejecutable
          code_cache = 'swan/src/core/cpu_code_cache.cpp'
          if os.path.exists(code_cache):
              with open(code_cache, 'r') as f:
                  c = f.read()
              patch_hdr = '''
          #if defined(EMUSUNI_PORT)
          extern "C" void* emusuni_jit_arena(size_t size, const char* name);
          #endif
          '''
              if 'extern "C" void* emusuni_jit_arena' not in c:
                  c = patch_hdr + c
              with open(code_cache, 'w') as f:
                  f.write(c)
              print("Header emusuni_jit_arena agregado a cpu_code_cache.cpp")

          # 3. Parche en jit_code_buffer.cpp para omitir mprotect de libc
          jit_buf = 'swan/src/common/jit_code_buffer.cpp'
          if os.path.exists(jit_buf):
              with open(jit_buf, 'r') as f:
                  jb = f.read()
              jb = jb.replace('#include <sys/mman.h>', '#include <sys/mman.h>\n#if defined(EMUSUNI_PORT)\n// Bypass mprotect de libc en PS4\n#endif')
              with open(jit_buf, 'w') as f:
                  f.write(jb)
              print("Parche jit_code_buffer.cpp aplicado.")
          EOF

      - name: Compilar
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          X="-I swan/dep/xbyak/xbyak -I swan/dep/libchdr/deps/miniz-3.1.1 -I swan/dep/openbios -DRETRO_ATOMIC_FORCE_GCC_NEW -DWITH_RECOMPILER=1 -DEMUSUNI_PORT=1"
          mkdir obj
          for f in swan/src/core/*.cpp swan/src/common/*.cpp; do
          case $f in *d3d*|*aarch32*|*aarch64*) continue;; esac
          O=obj/$(echo $f | tr / _).o
          if ! clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I swan/src $INC $X $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 -A2 "error:" e.txt | sed 's/.*error: //' | cut -c1-120 || true; fi
          done
          echo OBJETOS; ls obj | wc -l

      - name: Dependencias
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          for f in $(find swan/dep/xxhash swan/dep/libchdr -name "*.c" -not -path "*test*" -not -path "*example*" -not -path "*cmake*"); do
          O=obj/dep_$(echo $f | tr / _).o
          if ! clang --target=x86_64-pc-freebsd12-elf -std=gnu11 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include $INC -I swan/dep/libchdr/deps/miniz-3.1.1 $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_DEP; ls obj | grep -c "^dep_"

      - name: Extra
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          X="-I swan/dep/xbyak/xbyak -I swan/dep/libchdr/deps/miniz-3.1.1 -I swan/dep/openbios -DRETRO_ATOMIC_FORCE_GCC_NEW -DWITH_RECOMPILER=1 -DEMUSUNI_PORT=1"
          A=$(find swan/dep/libretro-common -name "*.c" \( -path "*/streams/*" -o -path "*/file/*" -o -path "*/vfs/*" -o -path "*/compat/*" -o -path "*/string/*" -o -path "*/encodings/*" -o -path "*/time/*" -o -path "*/rthreads/*" -o -path "*/memmap/*" \))
          B=$(grep -rl "retro_spsc_init\|data_transfer_open_prefix" swan/dep/libretro-common --include=*.c || true)
          for f in $(echo $A $B swan/dep/stb/src/stb_image.c | tr ' ' '\n' | sort -u); do
          O=obj/lrc_$(echo $f | tr / _).o
          if ! clang --target=x86_64-pc-freebsd12-elf -std=gnu11 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -I swan/dep/stub $INC $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_LRC; ls obj | grep -c "^lrc_"
          for f in swan/src/libretro/*.cpp; do
          O=obj/lib_$(echo $f | tr / _).o
          if ! clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I swan/src $INC $X $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 -A2 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_LIBRETRO; ls obj | grep -c "^lib_"

      - name: Frontend
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          curl -sL -o frontend/stb_easy_font.h https://raw.githubusercontent.com/nothings/stb/master/stb_easy_font.h
          ls -la frontend
          if ! clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I frontend frontend/main.cpp -o obj/frontend_main.o > e.txt 2>&1; then echo FALLA_MAIN; grep -m3 -A2 "error:" e.txt | cut -c1-120 || true; fi
          echo OBJ_MAIN; ls obj | grep -c "^frontend_main"

      - name: Enlazar
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          mkdir obj2
          cp obj/*.o obj2/
          rm -f obj2/*gpu_hw_vulkan* obj2/*gpu_hw_opengl*
          L="ld.lld -m elf_x86_64 -pie --script $OO/link.x --eh-frame-hdr --error-limit=0 --allow-multiple-definition --no-demangle --wrap=stat --wrap=lstat --wrap=fstat --wrap=shm_open --wrap=shm_unlink --wrap=ftruncate --wrap=mmap --wrap=munmap --wrap=mprotect --wrap=madvise -L$OO/lib $OO/lib/crt1.o"
          LIBS="-lc -lkernel -lc++ -lSceUserService -lSceVideoOut -lSceAudioOut -lScePad -lSceSysmodule -lSDL2"
          cat > stubhdr.c << 'EOF'
          #include <fcntl.h>
          #include <unistd.h>
          #include <string.h>
          void stub_hit(const char *n) {
            static const char *v[200];
            static int c = 0;
            static int first = 1;
            for (int i = 0; i < c; i++) if (v[i] == n) return;
            if (c >= 200) return;
            v[c++] = n;
            int fd = open("/data/swan/stubs.txt", O_WRONLY | O_CREAT | (first ? O_TRUNC : O_APPEND), 0666);
            first = 0;
            if (fd < 0) return;
            write(fd, n, strlen(n));
            write(fd, "\n", 1);
            fsync(fd);
            close(fd);
          }
          EOF
          cp stubhdr.c stub.c
          for i in 1 2 3 4 5; do
          clang --target=x86_64-pc-freebsd12-elf -fPIC -c -w -isysroot $OO -isystem $OO/include stub.c -o obj2/stub.o
          $L obj2/*.o $LIBS -o p3.elf > l2.txt 2>&1 || true
          grep "undefined symbol" l2.txt | sed 's/.*undefined symbol: //' | sort -u > s2.txt || true
          N=$(wc -l < s2.txt)
          echo ITER_$i PENDIENTES_$N
          if [ "$N" = "0" ]; then break; fi
          while read s; do case $s in GLAD_*|glad_*) echo "int $s;";; *) echo "void $s(void) { stub_hit(\"$s\"); }";; esac; done < s2.txt >> stub.c
          done
          echo ELF; ls -la p3.elf 2>&1 | cut -c1-80
          echo RETRO_RUN; nm p3.elf 2>/dev/null | grep -c " T retro_run" || true
          echo MAIN; nm p3.elf 2>/dev/null | grep -c " T main" || true
          echo QUEDAN; head -12 s2.txt | cut -c1-90
          echo PRIMERAS; head -3 l2.txt | cut -c1-150
          echo RELLENOS; grep -c 'stub_hit("' stub.c || true
          grep -o 'stub_hit("[^"]*")' stub.c | cut -c11-100 | head -80 || true

      - name: Guardar elf
        uses: actions/upload-artifact@v4
        with:
          name: p3elf
          path: p3.elf