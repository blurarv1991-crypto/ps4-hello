name: Ver SwanStation

on:
  push:
    paths:
      - '.github/workflows/swan.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Preparar
        run: |
          git clone --depth 1 https://github.com/libretro/swanstation.git swan
          curl -sL -o tc.tgz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir tc && tar -xzf tc.tgz -C tc
          sudo apt-get install -y clang lld > /dev/null
          sed -i '86s/.*/#define ABI_SYSV 1/' swan/src/core/cpu_recompiler_types.h
          sed -i 's/defined(__FreeBSD__)/defined(__x86_64__)/g' swan/src/common/memory_arena.h swan/src/common/memory_arena.cpp
          sed -i 's/std::clamp(/std::clamp<float>(/g' swan/src/core/analog_controller.cpp swan/src/core/analog_joystick.cpp swan/src/core/negcon.cpp swan/src/core/negcon_rumble.cpp
          printf '#define HAVE_MKSTEMP 1\n#define HAVE_ALLOCA_H 1\n' > swan/src/config.h
          mkdir -p swan/dep/stub
          printf '#include <pthread.h>\nstatic inline void pthread_set_name_np(pthread_t t, const char *n) { (void)t; (void)n; }\n' > swan/dep/stub/pthread_np.h
          sed 's/@[A-Za-z_0-9]*@/0/g' swan/src/libretro/version.h.in > swan/src/libretro/version.h
      - name: Compilar
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          X="-I swan/dep/xbyak/xbyak -I swan/dep/libchdr/deps/miniz-3.1.1 -I swan/dep/openbios -DRETRO_ATOMIC_FORCE_GCC_NEW -DWITH_RECOMPILER=1"
          mkdir obj
          for f in swan/src/core/*.cpp swan/src/common/*.cpp; do
          case $f in *d3d*|*aarch32*|*aarch64*) continue;; esac
          O=obj/$(echo $f | tr / _).o
          if ! clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I swan/src $INC $X $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 -A2 "error:" e.txt | sed 's/.*error: //' | cut -c1-120 || true; fi
          done
          echo OBJETOS; ls obj | wc -l
      - name: Dependencias
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          for f in $(find swan/dep/xxhash swan/dep/libchdr -name "*.c" -not -path "*test*" -not -path "*example*" -not -path "*cmake*"); do
          O=obj/dep_$(echo $f | tr / _).o
          if ! clang --target=x86_64-pc-freebsd12-elf -std=gnu11 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include $INC -I swan/dep/libchdr/deps/miniz-3.1.1 $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_DEP; ls obj | grep -c "^dep_"
      - name: Extra
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          X="-I swan/dep/xbyak/xbyak -I swan/dep/libchdr/deps/miniz-3.1.1 -I swan/dep/openbios -DRETRO_ATOMIC_FORCE_GCC_NEW -DWITH_RECOMPILER=1"
          A=$(find swan/dep/libretro-common -name "*.c" \( -path "*/streams/*" -o -path "*/file/*" -o -path "*/vfs/*" -o -path "*/compat/*" -o -path "*/string/*" -o -path "*/encodings/*" -o -path "*/time/*" -o -path "*/rthreads/*" -o -path "*/memmap/*" \))
          B=$(grep -rl "retro_spsc_init\|data_transfer_open_prefix" swan/dep/libretro-common --include=*.c || true)
          echo DEFINEN_SPSC_Y_DATA; echo $B
          for f in $(echo $A $B swan/dep/stb/src/stb_image.c | tr ' ' '\n' | sort -u); do
          O=obj/lrc_$(echo $f | tr / _).o
          if ! clang --target=x86_64-pc-freebsd12-elf -std=gnu11 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -I swan/dep/stub $INC $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_LRC; ls obj | grep -c "^lrc_"
          for f in swan/src/libretro/*.cpp; do
          O=obj/lib_$(echo $f | tr / _).o
          if ! clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -O1 -fPIC -c -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I swan/src $INC $X $f -o $O > e.txt 2>&1; then echo FALLA_$f; grep -m1 -A2 "error:" e.txt | sed 's/.*error: //' | cut -c1-110 || true; fi
          done
          echo OBJETOS_LIBRETRO; ls obj | grep -c "^lib_"
      - name: Enlazar
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          ld.lld -m elf_x86_64 -pie --script $OO/link.x --eh-frame-hdr --error-limit=0 --allow-multiple-definition -L$OO/lib $OO/lib/crt1.o obj/*.o -lc -lkernel -lc++ -o prueba.elf > link.txt 2>&1 || true
          grep "undefined symbol" link.txt | sed 's/.*undefined symbol: //' | sort -u > sym.txt || true
          c++filt < sym.txt | sort -u > dem.txt || true
          echo SIN_DEFINIR; wc -l < dem.txt
          echo API_RETRO; nm -g --defined-only obj/*.o 2>/dev/null | awk '{print $3}' | grep "^retro_" | tr '\n' ' ' | fold -w 90
          echo FICHEROS_QUE_PIDEN; grep "referenced by" link.txt | sed 's/.*referenced by //' | sort | uniq -c | sort -rn | head -22 | awk '{print $2" "$1}' | tr '\n' ' ' | fold -w 90
          echo OTROS; grep -v "GLAD\|^vk\|^ds_vk\|Vulkan\|GL::" dem.txt | cut -c1-60 | head -50 | tr '\n' ' ' | fold -w 90
