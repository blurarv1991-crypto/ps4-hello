name: Ver SwanStation

on:
  push:
    paths:
      - '.github/workflows/swan.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Mirar codigo
        run: |
          git clone --depth 1 https://github.com/libretro/swanstation.git swan
          echo CARPETAS; ls swan
          echo DEP; ls swan/dep
          echo CORE_ARCHIVOS; ls swan/src/core | wc -l
          echo CMAKE_LIBS; grep -n "find_package\|CXX_STANDARD" swan/CMakeLists.txt | head -30
