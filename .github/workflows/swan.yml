name: Ver SwanStation

on:
  push:
    paths:
      - '.github/workflows/swan.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Preparar
        run: |
          git clone --depth 1 https://github.com/libretro/swanstation.git swan
          curl -sL -o tc.tgz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir tc && tar -xzf tc.tgz -C tc
          sudo apt-get install -y clang lld > /dev/null
      - name: Buscar
        run: |
          OO=$PWD/tc/OpenOrbis/PS4Toolchain
          INC=$(find swan/dep -type d -name include | sed 's/^/-I /' | tr '\n' ' ')
          X="-I swan/dep/xbyak/xbyak -I swan/dep/libchdr/deps/miniz-3.1.1 -I swan/dep/openbios -DRETRO_ATOMIC_FORCE_GCC_NEW"
          echo ABI; grep -rn -B10 "Unknown ABI" swan/src | cut -c1-110 | head -24
          echo CONFIG; find swan -name "config.h*" | head -5
          grep -n "config.h" swan/src/common/byte_stream.cpp | head -3
          echo SHMEM; grep -n "m_shmem_fd" swan/src/common/memory_arena.cpp | head -6
          echo CLAMP; clang++ --target=x86_64-pc-freebsd12-elf -std=gnu++17 -fsyntax-only -w -isysroot $OO -isystem $OO/include -isystem $OO/include/c++/v1 -I swan/src $INC $X swan/src/core/negcon.cpp 2>&1 | grep -A8 "error:" | cut -c1-150 | head -16
