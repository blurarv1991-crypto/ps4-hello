name: Ver PacBrew

on:
  push:
    paths:
      - '.github/workflows/pacbrew.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Consultar paquetes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pacman-package-manager makepkg libarchive-tools
          printf '\n[pacbrew]\nSigLevel = Optional TrustAll\nServer = http://pacbrew.mydedibox.fr/packages/\n' | sudo tee -a /etc/pacman.conf
          sudo pacman -Sy
          echo "BUSCANDO FFMPEG:"
          pacman -Ss ffmpeg || true
          echo "PAQUETES PS4:"
          pacman -Sl pacbrew | grep -i ps4 | head -80 || true
