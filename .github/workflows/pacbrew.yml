name: Ver PacBrew

on:
  push:
    paths:
      - '.github/workflows/pacbrew.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Mirar imagen Docker
        run: |
          docker pull xfangfang/pacbrew:231021
          docker run --rm --entrypoint /bin/bash xfangfang/pacbrew:231021 -c 'P=/opt/pacbrew/ps4/openorbis; echo USR_LIB; ls $P/usr/lib | head -80; echo USR_INCLUDE; ls $P/usr/include | head -60; echo BUSCANDO_SDL; find /opt/pacbrew -iname "*SDL2*" | head -15'
