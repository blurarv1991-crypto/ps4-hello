name: Ver PacBrew

on:
  push:
    paths:
      - '.github/workflows/pacbrew.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Mirar imagen Docker
        run: |
          docker pull xfangfang/pacbrew:231021
          docker run --rm xfangfang/pacbrew:231021 sh -c '
            echo "CARPETA PS4:"
            ls /opt/pacbrew/ps4/openorbis
            echo "BUSCANDO FFMPEG:"
            find /opt/pacbrew -iname "*avcodec*" -o -iname "*ffmpeg*" | head -20
            echo "LIBRERIAS PS4:"
            ls /opt/pacbrew/ps4/openorbis/portlibs/usr/lib 2>/dev/null | head -80
          '
