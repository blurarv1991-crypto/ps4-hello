name: Ver PacBrew

on:
  push:
    paths:
      - '.github/workflows/pacbrew.yml'

jobs:
  ver:
    runs-on: ubuntu-24.04
    steps:
      - name: Mirar imagen Docker
        run: |
          docker pull xfangfang/pacbrew:231021
          docker run --rm --entrypoint /bin/bash xfangfang/pacbrew:231021 -c 'echo CARPETA_PS4; ls /opt/pacbrew/ps4/openorbis; echo BUSCANDO_FFMPEG; find /opt/pacbrew -iname "*avcodec*" -o -iname "*ffmpeg*" | head -20; echo LIBRERIAS_PS4; ls /opt/pacbrew/ps4/openorbis/portlibs/usr/lib | head -80'
